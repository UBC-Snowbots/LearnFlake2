name: repo_hygiene

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages and file sizes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check_hygiene.sh "origin/${{ github.base_ref }}..HEAD"
          else
            scripts/check_hygiene.sh HEAD
          fi
